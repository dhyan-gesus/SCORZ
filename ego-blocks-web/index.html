      if (idx !== lastIdx) { lastIdx = idx; Sfx.tick(); }
      if (t < 1) requestAnimationFrame(step);
      else this.spinDone(kind, id, r, dupe);
    };
    requestAnimationFrame(step);
  },
  spinDone(kind, id, r, dupe) {
    this.spinning = false;
    const src = kind === 'style' ? STYLES[id] : FLOWS[id];
    Sfx.fanfare(r);
    const card = $('reel').querySelectorAll('.card')[40];
    if (card) { card.style.transform = 'translateY(-8px) scale(1.06)'; card.style.transition = 'transform .2s steps(3)'; }
    const fl = $('flash');
    if (r >= 2) {
      fl.className = r === 4 ? 'rainbow' : '';
      fl.style.background = r === 4 ? '' : RARITY_HEX[src.rarity];
      fl.animate([{ opacity: r === 4 ? 0.95 : 0.5 }, { opacity: 0 }], { duration: r === 4 ? 1400 : 650, easing: 'steps(6)' });
    }
    if (r >= 3) $('scr-spins').animate([{ transform: 'translate(6px,0)' }, { transform: 'translate(-6px,3px)' }, { transform: 'translate(4px,-3px)' }, { transform: 'translate(0,0)' }], { duration: 380, iterations: r === 4 ? 3 : 1 });
    const tag = dupe ? '<span class="tag dupe">DUPLICATE · +50 EMERALDS</span>' : '<span class="tag">NEW</span>';
    $('spin-result').innerHTML = `<span class="rar" data-r="${src.rarity}">${src.rarity.toUpperCase()}</span><span>${esc(src.name)}</span>${tag}${!dupe ? '<button class="btn small" id="spin-equip" type="button">EQUIP</button>' : ''}`;
    const eq = $('spin-equip');
    if (eq) eq.addEventListener('click', () => { Sfx.click(); if (kind === 'style') Save.data.style = id; else Save.data.flow = id; Save.save(); eq.textContent = 'EQUIPPED'; eq.disabled = true; });
    this.renderSpins(false);
  },
  /* ---------- locker ---------- */
  openLocker() { this.lockerTab = 'style'; this.lockerSel = Save.data.style; this.show('locker'); this.renderLocker(); },
  renderLocker() {
    const d = Save.data, tab = this.lockerTab;
    $('ltab-style').setAttribute('aria-selected', tab === 'style'); $('ltab-flow').setAttribute('aria-selected', tab === 'flow');
    const grid = $('locker-grid');
    let ids = tab === 'style' ? STYLE_IDS : ['NONE'].concat(FLOW_IDS);
    grid.innerHTML = ids.map((id) => {
      const src = id === 'NONE' ? { name: 'NO FLOW', rarity: 'Rare' } : (tab === 'style' ? STYLES[id] : FLOWS[id]);
      const owned = id === 'NONE' || (tab === 'style' ? d.styles.includes(id) : d.flows.includes(id));
      const equipped = tab === 'style' ? d.style === id : (d.flow || 'NONE') === id;
      return `<button type="button" class="lcard ${owned ? '' : 'locked'}" data-id="${id}" aria-pressed="${this.lockerSel === id}" style="--rc:${id === 'NONE' ? '#5a5f78' : RARITY_HEX[src.rarity]}"><span class="nm">${esc(src.name)}</span><span class="meta">${id === 'NONE' ? '<span class="chip">BASE</span>' : `<span class="rar" data-r="${src.rarity}">${src.rarity.toUpperCase()}</span>`}<span class="label">${equipped ? 'EQUIPPED' : owned ? 'OWNED' : 'LOCKED'}</span></span></button>`;
    }).join('');
    grid.querySelectorAll('.lcard').forEach((b) => b.addEventListener('click', () => { Sfx.click(); this.lockerSel = b.dataset.id; this.renderLocker(); }));
    this.renderLockerDetail();
  },
  renderLockerDetail() {
    const d = Save.data, tab = this.lockerTab, id = this.lockerSel;
    const det = $('locker-detail');
    if (tab === 'style') {
      const st = STYLES[id]; const owned = d.styles.includes(id);
      det.innerHTML = `<div class="head"><span class="cv"></span><div style="display:grid;gap:6px"><span class="rar" data-r="${st.rarity}" style="justify-self:start">${st.rarity.toUpperCase()}</span><h3>${esc(st.name)}</h3><p style="margin:0;color:var(--muted);max-width:46ch">${esc(st.blurb)}</p></div></div>
        <div class="ab-list">${st.abilities.map((a, i) => { const A = ABILITIES[a]; return `<div class="ab"><img class="px" src="${iconURL(A.icon, st.aura)}" alt=""><div><div class="t"><span class="key">${KEYS3[i]}</span><b>${esc(A.name)}</b><span class="label">${A.cd}S COOLDOWN</span></div><p>${esc(A.desc)}</p></div></div>`; }).join('')}</div>
        ${owned ? `<button class="btn ${d.style === id ? '' : 'blue'}" id="lk-equip" type="button" ${d.style === id ? 'disabled' : ''}>${d.style === id ? 'EQUIPPED' : 'EQUIP ' + esc(st.name)}</button>` : `<p class="label">LOCKED. ROLL IT FROM STYLE SPINS (${st.rarity.toUpperCase()}).</p>`}`;
      det.querySelector('.cv').replaceWith(portraitCanvas(id, 96));
    } else {
      const fl = id === 'NONE' ? null : FLOWS[id];
      const owned = id === 'NONE' || d.flows.includes(id);
      const eqd = (d.flow || 'NONE') === id;
      det.innerHTML = `<div class="head"><span class="cv"></span><div style="display:grid;gap:6px">${fl ? `<span class="rar" data-r="${fl.rarity}" style="justify-self:start">${fl.rarity.toUpperCase()}</span>` : '<span class="chip" style="justify-self:start">BASE</span>'}<h3>${fl ? esc(fl.name) : 'NO FLOW'}</h3></div></div>
        <p style="margin:0;font-size:22px">${esc(fl ? fl.desc : RAW_FLOW_DESC)}</p>
        <p style="margin:0;color:var(--muted)">Fill the Flow bar with completed passes, dodges, tackles and shots on target. Press G for 15 seconds of Flow: glowing eyes, a swirling aura and this buff.</p>
        ${owned ? `<button class="btn ${eqd ? '' : 'blue'}" id="lk-equip" type="button" ${eqd ? 'disabled' : ''}>${eqd ? 'EQUIPPED' : 'EQUIP'}</button>` : `<p class="label">LOCKED. ROLL IT FROM FLOW SPINS (${fl.rarity.toUpperCase()}).</p>`}`;
      det.querySelector('.cv').replaceWith(flowEmblemCanvas(id === 'NONE' ? null : id, 96));
    }
    const eq = $('lk-equip');
    if (eq) eq.addEventListener('click', () => { Sfx.click(); if (tab === 'style') d.style = id; else d.flow = id === 'NONE' ? null : id; Save.save(); this.renderLocker(); });
  },
};

/* ---- 12_main.js ---- */
/* =====================================================================
   Game: state machine, main loop, rewards, auto quality
   ===================================================================== */
const Game = {
  state: 'boot', match: null, lastMode: null, last: 0, time: 0, ended: false, autoQ: 'med', pausedAt: 0,
  perf: { t: 0, frames: 0 }, crowdT: 0,
  start() {
    Save.load(); Save.validate();
    Sfx.setMuted(Save.data.settings.mute);
    World.init($('gl'));
    FX.init(World.scene);
    UI.init();
    Input.init($('gl'));
    this.applyQuality();
    window.addEventListener('resize', () => World.resize());
    document.addEventListener('visibilitychange', () => { if (document.hidden && this.state === 'match') this.pause(); });
    this.toLobby();
    this.last = performance.now();
    const tick = (t) => { requestAnimationFrame(tick); if (!this.manual) this.loop(t); };
    requestAnimationFrame(tick);
  },
  applyQuality() { const q = Save.data.settings.quality; World.setQuality(q === 'auto' ? this.autoQ : q); },
  toLobby() {
    if (this.match) { this.match.dispose(); this.match = null; }
    Input.releaseLock();
    this.state = 'lobby';
    World.setSun(SUN_LOBBY);
    UI.hideOverlays(); UI.show('lobby');
    TimeCtl.reset(); FX.clear();
    Sfx.setCrowd(0.2);
  },
  startMatch(mode) {
    if (this.match) { this.match.dispose(); this.match = null; }
    UI.hideOverlays();
    Sfx.init();
    TimeCtl.reset(); FX.clear();
    this.match = new Match(mode, difficultyFor(Save.data.rp));
    this.lastMode = mode; this.ended = false;
    World.setSun(SUN_MATCH);
    Cam.reset(0);
    this.state = 'match';
    UI.show('hud'); UI.buildHud(this.match);
    Sfx.setCrowd(0.55);
    Input.requestLock();
    Input.consumeEdges();
    Cam.look(0); Cam.follow(1, this.match);
  },
  pause() {
    if (this.state !== 'match' || !this.match) return;
    this.state = 'paused'; this.match.paused = true; this.pausedAt = performance.now();
    Input.releaseLock();
    UI.showPause(true);
  },
  resume() {
    if (this.state !== 'paused') return;
    this.state = 'match'; this.match.paused = false;
    UI.showPause(false);
    Input.consumeEdges();
    Input.requestLock();
    UI.lockHint();
  },
  onEscape() {
    if (this.state === 'match') this.pause();
    else if (this.state === 'paused' && performance.now() - this.pausedAt > 350) this.resume();
  },
  forfeit() { UI.showPause(false); this.finishMatch(true); },
  finishMatch(forfeit) {
    if (this.ended || !this.match) return;
    this.ended = true;
    const m = this.match, d = Save.data;
    const res = forfeit ? 'forfeit' : m.result.res;
    const hs = forfeit ? (m.human ? Object.assign({}, m.human.stats) : { goals: 0, assists: 0, shots: 0, tackles: 0 }) : (m.result.human || { goals: 0, assists: 0, shots: 0, tackles: 0 });
    const earn = [];
    if (!forfeit) {
      earn.push([res === 'win' ? 'WIN' : res === 'draw' ? 'DRAW' : 'LOSS', res === 'win' ? 150 : res === 'draw' ? 80 : 50]);
      if (hs.goals) earn.push([hs.goals + (hs.goals === 1 ? ' GOAL' : ' GOALS'), 20 * hs.goals]);
      if (hs.assists) earn.push([hs.assists + (hs.assists === 1 ? ' ASSIST' : ' ASSISTS'), 10 * hs.assists]);
    }
    const emeralds = earn.reduce((a, e) => a + e[1], 0);
    d.emeralds += emeralds;
    const rpBefore = d.rp;
    if (m.cfg.ranked) d.rp = Math.max(0, d.rp + (res === 'win' ? 25 : res === 'draw' ? 5 : -15));
    d.stats.played++;
    if (res === 'win') d.stats.wins++; else if (res === 'draw') d.stats.draws++; else d.stats.losses++;
    d.stats.goals += hs.goals || 0; d.stats.assists += hs.assists || 0;
    Save.save();
    this.state = 'results'; m.paused = true;
    Input.releaseLock();
    UI.showResults({ res, score: m.score.slice(), human: hs, earn, emeralds, ranked: m.cfg.ranked, rpBefore, rpAfter: d.rp, modeName: m.cfg.name });
    if (res === 'win') Sfx.fanfare(2);
    Sfx.setCrowd(0.3);
  },
  perfCheck(rdt) {
    if (Save.data.settings.quality !== 'auto') return;
    const P = this.perf; P.t += rdt; P.frames++;
    if (P.t >= 4) {
      const fps = P.frames / P.t; P.t = 0; P.frames = 0;
      if (fps < 45 && World.quality !== 'low') {
        this.autoQ = World.quality === 'high' ? 'med' : 'low';
        World.setQuality(this.autoQ);
        UI.toast('GRAPHICS LOWERED TO KEEP IT SMOOTH', 'gold');
      }
    }
  },
  loop(now, doRender = true) {
    let rdt = (now - this.last) / 1000; this.last = now;
    if (!(rdt > 0)) rdt = 0;
    rdt = Math.min(rdt, 0.05);
    this.time += rdt;
    Input.pollPad();
    const m = this.match;
    if (m && (this.state === 'match' || this.state === 'paused' || this.state === 'results')) {
      if (this.state === 'match') {
        Cam.look(rdt);
        m.ctl = Input.controls();
        const sdt = TimeCtl.step(rdt);
        if (sdt > 0) {
          let rem = sdt, first = true;
          while (rem > 1e-5) {
            const h = Math.min(rem, 1 / 60);
            m.update(h); rem -= h;
            if (first) { first = false; Input.consumeEdges(); m.ctl = Input.controls(); }
          }
        }
        FX.update(sdt);
        Shake.update(rdt);
        Cam.follow(rdt, m);
        UI.updateHud(m, rdt);
        this.perfCheck(rdt);
        this.crowdT -= rdt;
        if (this.crowdT <= 0) {
          this.crowdT = 0.6;
          const b = m.ball, near = Math.max(0, 1 - (F.L - Math.abs(b.pos.z)) / 18);
          Sfx.setCrowd(0.45 + near * 0.7);
        }
        if (m.phase === 'end' && m.phaseT > 3.2 && !this.ended) this.finishMatch(false);
      } else { Shake.update(rdt); }
    } else {
      Cam.lobby(rdt, this.time);
      FX.update(rdt);
    }
    World.update(rdt);
    Input.endFrame();
    if (doRender) World.render();
  },
  /** test hook: advance n frames at a fixed 60fps without waiting on the GPU */
  stepManual(n, render) { this.manual = true; for (let i = 0; i < n; i++) this.loop(this.last + 1000 / 60, render && i === n - 1); },
};

/* debug + test hooks (harmless in normal play) */
window.EGO = {
  Game, World, Save, AI, Match, FX, TimeCtl, UI, rollRarity, poolFor,
  /** run a full bot-vs-bot match off-screen and report what happened */
  simulate(mode = 'quick', d = 0.5, seconds = 240) {
    const m = new Match(mode, d, { noHuman: true, autopilot: true, length: seconds });
    const log = { goals: 0, outs: 0, saves: 0, tackles: 0, passes: 0, shots: 0, possessionSwaps: 0, abilities: 0, flows: 0, phases: {} };
    const origOut = m.onOut.bind(m); m.onOut = function () { log.outs++; return origOut(); };
    const origAb = m.useAbility.bind(m); m.useAbility = function (p, i) { const r = origAb(p, i); if (r) log.abilities++; return r; };
    const origFlow = m.activateFlow.bind(m); m.activateFlow = function (p) { const r = origFlow(p); if (r) log.flows++; return r; };
    log.tackleTries = 0; log.ankles = 0; log.dodges = 0;
    const oT = m.tackle.bind(m); m.tackle = function (p, x, z) { const r = oT(p, x, z); if (r) log.tackleTries++; return r; };
    const oA = m.ankleBreak.bind(m); m.ankleBreak = function (a, b) { log.ankles++; return oA(a, b); };
    log.slideVsCarrier = 0; log.slideNoCarrier = 0; log.missDist = [];
    const oB = m.beginSlide.bind(m); m.beginSlide = function (p) { const c = m.ball.owner; if (c && c.team !== p.team) { log.slideVsCarrier++; p._tgt = c; } else { log.slideNoCarrier++; p._tgt = null; } return oB(p); };
    const oU = m.updateSlides.bind(m); m.updateSlides = function () { for (const p of m.players) { if (p.state === 'slide' && p.stateT + 1 / 60 >= p.stateDur && p.slide && !p.slide.hit && p._tgt) { log.missDist.push(+dist2D(p.pos, p._tgt.pos).toFixed(1)); p._tgt = null; } } return oU(); };
    const oD = m.dodge.bind(m); m.dodge = function (p, x, z) { const r = oD(p, x, z); if (r) log.dodges++; return r; };
    let lastOwnerTeam = -1, t = 0;
    while (m.phase !== 'end' && t < seconds * 3 + 200) {
      m.update(1 / 60); t += 1 / 60;
      FX.update(1 / 60);
      const o = m.ball.owner;
      if (o && o.team !== lastOwnerTeam) { log.possessionSwaps++; lastOwnerTeam = o.team; }
      log.phases[m.phase] = (log.phases[m.phase] || 0) + 1 / 60;
    }
    for (const p of m.players) { log.saves += p.stats.saves; log.tackles += p.stats.tackles; log.passes += p.stats.passes; log.shots += p.stats.shots; }
    log.score = m.score.slice(); log.goals = m.score[0] + m.score[1]; log.simSeconds = Math.round(t);
    m.dispose();
    return log;
  },
};

window.addEventListener('load', () => {
  try {
    if (typeof THREE === 'undefined') throw new Error('3D engine failed to load. Check your connection and reload the page.');
    Game.start();
  } catch (err) {
    const b = document.getElementById('boot') || document.getElementById('app');
    if (b) { b.style.display = 'grid'; b.innerHTML = '<div style="max-width:40ch;text-align:center;font-family:var(--font-body);font-size:18px;padding:16px">EGO BLOCKS could not start.<br><br>' + esc(err && err.message ? err.message : String(err)) + '</div>'; }
    console.error(err);
  }
});

})();
